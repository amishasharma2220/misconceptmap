# Starter Databases questions for MisconceptMap. Original questions written for this project
# (not copied from GATE papers). Import with:
#   python -m app.content.questions_loader ../content/questions/dbms.yaml
# Every wrong option that reflects a known wrong belief points at a misconception below.

misconceptions:
  - slug: one-candidate-key
    concept: functional-dependencies
    title: A relation has only one candidate key
    explanation: |
      Every minimal set of attributes whose closure is the whole relation is a candidate key, and
      there can be several. After finding one, check other combinations of the attributes that
      must appear in every key.

  - slug: no-transitive-means-3nf
    concept: normal-forms
    title: No transitive dependency means the relation is in 3NF
    explanation: |
      3NF also requires 2NF: no non-prime attribute may depend on *part* of a candidate key.
      A partial dependency such as $B \to D$ with key $AB$ keeps the relation in 1NF.

  - slug: key-part-lhs-is-bcnf
    concept: normal-forms
    title: A determinant that is part of a key is fine for BCNF
    explanation: |
      BCNF requires every non-trivial FD's left side to be a *superkey*. Being part of a key is
      not enough: $B \to D$ with key $AB$ violates BCNF.

  - slug: prime-rhs-is-bcnf
    concept: normal-forms
    title: If the right side is a prime attribute, the FD satisfies BCNF
    explanation: |
      That exception belongs to 3NF only. For BCNF the left side must be a superkey, whatever is
      on the right. $C \to B$ with candidate keys $AB$ and $AC$ is allowed by 3NF but violates
      BCNF.

  - slug: shared-attribute-lossless
    concept: decomposition
    title: Sharing an attribute is enough for a lossless join
    explanation: |
      The shared attributes must be a superkey of at least one of the two parts, that is,
      $R_1 \cap R_2 \to R_1$ or $R_1 \cap R_2 \to R_2$. Sharing an attribute that determines
      nothing gives spurious tuples.

  - slug: division-means-any
    concept: relational-algebra
    title: R ÷ S finds tuples related to any value in S
    explanation: |
      Division finds the values related to **every** tuple of S ("students who took *all* the
      listed courses"). "Related to at least one" is a join followed by a projection.

  - slug: division-means-exactly
    concept: relational-algebra
    title: R ÷ S finds tuples related to exactly the values in S
    explanation: |
      Division needs *at least* all of S. A student who took every listed course and some others
      as well is still in the result.

  - slug: null-counts-as-zero
    concept: sql-aggregation
    title: Aggregates treat NULL as zero
    explanation: |
      SUM, AVG, MIN, MAX and COUNT(column) ignore NULLs entirely. AVG divides by the number of
      non-NULL values, not by the number of rows.

  - slug: null-makes-aggregate-null
    concept: sql-aggregation
    title: One NULL makes the whole aggregate NULL
    explanation: |
      Arithmetic with NULL gives NULL (`5 + NULL` is NULL), but aggregate functions skip NULL
      values. AVG is NULL only if every value is NULL (or there are no rows).

  - slug: having-filters-rows
    concept: sql-aggregation
    title: HAVING filters individual rows
    explanation: |
      WHERE filters rows before grouping. HAVING filters *groups* after grouping, so its
      conditions are about aggregates of each group, such as `COUNT(*)` or `AVG(salary)`.

  - slug: not-in-ignores-null
    concept: sql-basics
    title: NOT IN ignores NULLs in the subquery
    explanation: |
      `x NOT IN (2, NULL)` means `x <> 2 AND x <> NULL`. `x <> NULL` is UNKNOWN, so the whole
      condition is never TRUE and no row qualifies. Use NOT EXISTS, or filter out the NULLs.

  - slug: serial-order-by-first-operation
    concept: serializability
    title: A schedule is equivalent to the serial order of its first operations
    explanation: |
      Equivalence is decided by the order of *conflicting* operations. Build the precedence graph:
      an edge $T_i \to T_j$ for each conflict where $T_i$ acts first. A cycle means no serial
      order is conflict-equivalent.

  - slug: reads-conflict
    concept: serializability
    title: Two reads of the same item conflict
    explanation: |
      Operations conflict only if they are on the same item, from different transactions, and at
      least one is a write. Read–read pairs never conflict.

  - slug: recoverable-if-all-commit
    concept: recoverability
    title: A schedule is recoverable as long as every transaction commits
    explanation: |
      Recoverability is about commit *order*: if $T_j$ reads a value written by $T_i$, then
      $T_i$ must commit before $T_j$ does. Otherwise, if $T_i$ aborts after $T_j$ has committed,
      $T_j$'s result cannot be undone.

  - slug: dirty-read-is-cascadeless
    concept: recoverability
    title: A schedule with dirty reads can be cascadeless
    explanation: |
      Cascadeless means transactions read only *committed* data. Any read of an uncommitted
      write (a dirty read) makes the schedule not cascadeless.

  - slug: two-pl-prevents-deadlock
    concept: locking-2pl
    title: Two-phase locking prevents deadlock
    explanation: |
      2PL (basic, strict or rigorous) guarantees conflict serializability, but two transactions
      can still each hold a lock the other is waiting for. Deadlock must be prevented or detected
      separately.

  - slug: basic-2pl-is-cascadeless
    concept: locking-2pl
    title: Basic 2PL prevents cascading rollbacks
    explanation: |
      In basic 2PL a transaction may release exclusive locks before it commits, so others can
      read its uncommitted writes. Strict 2PL, which holds exclusive locks until commit, is what
      gives cascadeless schedules.

  - slug: bplus-forget-extra-pointer
    concept: bplus-trees
    title: An internal B+ tree node holds equal numbers of keys and pointers
    explanation: |
      An internal node with $p$ child pointers holds $p - 1$ keys. The condition is
      $p \cdot P + (p - 1) \cdot K \le B$, not $p (P + K) \le B$.

  - slug: bplus-ignore-pointers
    concept: bplus-trees
    title: Node order depends only on key size
    explanation: |
      A node stores keys *and* pointers, and both take space in the block. Dividing the block
      size by the key size alone overestimates the order.

  - slug: relationship-always-table
    concept: er-to-relational
    title: Every relationship needs a table of its own
    explanation: |
      A 1:N relationship can be stored as a foreign key on the "N" side, and a 1:1 as a foreign
      key on either side. Only M:N relationships (and relationships of degree three or more)
      need their own table.

questions:
  - key: dbms-fd-001
    concept: functional-dependencies
    also: [relational-keys]
    difficulty: 3
    source: original
    stem: |
      Relation $R(A, B, C, D)$ has the functional dependencies
      $A \to B$, $BC \to D$ and $D \to A$. How many candidate keys does $R$ have?
    options:
      - text: "1"
        misconception: one-candidate-key
      - text: "2"
      - text: "3"
        correct: true
      - text: "4"
    explanation: |
      $C$ appears on no right side, so it is in every key, and $C^+ = \{C\}$ alone is not enough.
      $AC^+ = \{A, C, B, D\}$, $BC^+ = \{B, C, D, A\}$ and $CD^+ = \{C, D, A, B\}$, so $AC$, $BC$
      and $CD$ are all keys, and none of them contains another. Any other superkey contains one
      of these, so there are exactly 3 candidate keys.

  - key: dbms-nf-001
    concept: normal-forms
    also: [functional-dependencies]
    difficulty: 3
    source: original
    stem: |
      Relation $R(A, B, C, D)$ has the only candidate key $AB$ and the functional dependencies
      $AB \to C$ and $B \to D$. What is the highest normal form $R$ is in?
    options:
      - text: 1NF
        correct: true
      - text: 2NF
      - text: 3NF
        misconception: no-transitive-means-3nf
      - text: BCNF
        misconception: key-part-lhs-is-bcnf
    explanation: |
      $D$ is non-prime and depends on $B$, which is only part of the key $AB$. That partial
      dependency violates 2NF, so $R$ is in 1NF only.

  - key: dbms-nf-002
    concept: normal-forms
    also: [functional-dependencies]
    difficulty: 4
    source: original
    stem: |
      Relation $R(A, B, C)$ has the functional dependencies $AB \to C$ and $C \to B$.
      What is the highest normal form $R$ is in?
    options:
      - text: 1NF
      - text: 2NF
      - text: 3NF
        correct: true
      - text: BCNF
        misconception: prime-rhs-is-bcnf
    explanation: |
      Candidate keys: $AB$, and $AC$ (since $AC^+ = \{A, C, B\}$). So every attribute is prime.
      $C \to B$: $C$ is not a superkey, but $B$ is prime, which 3NF allows. BCNF does not allow
      it, because the left side must be a superkey. So $R$ is in 3NF but not BCNF.

  - key: dbms-decomp-001
    concept: decomposition
    difficulty: 3
    source: original
    stem: |
      Relation $R(A, B, C)$ has the single functional dependency $A \to B$. Which decomposition
      is lossless?
    options:
      - text: $R_1(A, B)$ and $R_2(B, C)$
        misconception: shared-attribute-lossless
      - text: $R_1(A, B)$ and $R_2(A, C)$
        correct: true
      - text: $R_1(A, C)$ and $R_2(B, C)$
        misconception: shared-attribute-lossless
      - text: $R_1(A)$ and $R_2(B, C)$
    explanation: |
      A two-way decomposition is lossless when the common attributes determine one side.
      $\{A,B\} \cap \{A,C\} = A$ and $A \to B$, so $A$ is a key of $R_1$: lossless.
      In the other options the common attribute ($B$ or $C$) determines nothing, or there is no
      common attribute at all, so joining can create spurious tuples.

  - key: dbms-ra-001
    concept: relational-algebra
    difficulty: 3
    source: original
    stem: |
      $\text{Took}(\text{student}, \text{course})$ contains
      (1, a), (1, b), (2, a), (3, a), (3, b), (3, c).
      $\text{Req}(\text{course})$ contains a and b.

      What is $\text{Took} \div \text{Req}$?
    options:
      - text: "{1, 3}"
        correct: true
      - text: "{1, 2, 3}"
        misconception: division-means-any
      - text: "{1}"
        misconception: division-means-exactly
      - text: "{3}"
    explanation: |
      Division returns the students who took **every** course in Req. Student 1 took a and b,
      and student 3 took a, b and c (extra courses do not matter). Student 2 never took b.

  - key: dbms-sql-001
    concept: sql-aggregation
    difficulty: 2
    source: original
    stem: |
      Table `Scores(marks)` has four rows: 10, 20, NULL and 30. What does this return?

      ```sql
      SELECT AVG(marks) FROM Scores;
      ```
    options:
      - text: "15"
        misconception: null-counts-as-zero
      - text: "20"
        correct: true
      - text: "NULL"
        misconception: null-makes-aggregate-null
      - text: "60"
    explanation: |
      AVG ignores the NULL row: $(10 + 20 + 30) / 3 = 20$. Treating NULL as 0 would give
      $60 / 4 = 15$.

  - key: dbms-sql-002
    concept: sql-basics
    difficulty: 3
    source: original
    stem: |
      Table `A(a)` has rows 1, 2, 3. Table `B(b)` has rows 2 and NULL. Which rows does this
      query return?

      ```sql
      SELECT a FROM A
      WHERE a NOT IN (SELECT b FROM B);
      ```
    options:
      - text: 1 and 3
        misconception: not-in-ignores-null
      - text: No rows
        correct: true
      - text: 1, 2 and 3
      - text: Only 2
    explanation: |
      `a NOT IN (2, NULL)` means `a <> 2 AND a <> NULL`. The comparison with NULL is UNKNOWN,
      so the condition is FALSE for 2 and UNKNOWN for 1 and 3. WHERE keeps only TRUE rows,
      so nothing is returned.

  - key: dbms-sql-003
    concept: sql-aggregation
    difficulty: 3
    source: original
    stem: |
      Table `Emp(dept, salary)` contains (A, 10), (A, 20), (B, 30), (C, 5), (C, 5), (C, 5).
      Which departments does this query return?

      ```sql
      SELECT dept FROM Emp
      GROUP BY dept
      HAVING COUNT(*) > 1 AND AVG(salary) > 10;
      ```
    options:
      - text: A only
        correct: true
      - text: A and C
      - text: No departments
        misconception: having-filters-rows
      - text: A and B
    explanation: |
      Groups: A has 2 rows with average 15 (kept), B has 1 row (dropped by `COUNT(*) > 1`),
      C has 3 rows with average 5 (dropped by `AVG(salary) > 10`). Only A remains.

  - key: dbms-ser-001
    concept: serializability
    also: [transactions-acid]
    difficulty: 3
    source: original
    stem: |
      Consider the schedule
      $r_1(X),\ r_2(X),\ w_1(X),\ w_2(X)$.
      Which statement is correct?
    options:
      - text: It is conflict serializable, equivalent to $T_1 \to T_2$
        misconception: serial-order-by-first-operation
      - text: It is not conflict serializable
        correct: true
      - text: It is conflict serializable, equivalent to $T_2 \to T_1$
      - text: It is not serializable only because both transactions read X
        misconception: reads-conflict
    explanation: |
      $r_1(X)$ before $w_2(X)$ gives the edge $T_1 \to T_2$. $r_2(X)$ before $w_1(X)$ gives
      $T_2 \to T_1$. The precedence graph has a cycle, so no serial order is conflict-equivalent.
      The two reads do not conflict with each other; the cycle comes from read–write pairs.

  - key: dbms-rec-001
    concept: recoverability
    difficulty: 3
    source: original
    stem: |
      Consider the schedule
      $w_1(X),\ r_2(X),\ w_2(Y),\ c_2,\ c_1$
      where $c_i$ is the commit of $T_i$. Which statement is correct?
    options:
      - text: It is recoverable, because both transactions commit
        misconception: recoverable-if-all-commit
      - text: It is not recoverable
        correct: true
      - text: It is cascadeless but not strict
        misconception: dirty-read-is-cascadeless
      - text: It is strict
    explanation: |
      $T_2$ reads X written by $T_1$ and commits before $T_1$. If $T_1$ then aborted, $T_2$'s
      committed work would be based on a value that never existed. A recoverable schedule needs
      $c_1$ before $c_2$. The dirty read also rules out cascadeless and strict.

  - key: dbms-2pl-001
    concept: locking-2pl
    difficulty: 2
    source: original
    stem: |
      Which statement about **basic** two-phase locking is correct?
    options:
      - text: Every schedule it allows is conflict serializable
        correct: true
      - text: It prevents deadlock
        misconception: two-pl-prevents-deadlock
      - text: It prevents cascading rollbacks
        misconception: basic-2pl-is-cascadeless
      - text: A transaction may acquire new locks after releasing one
    explanation: |
      Ordering transactions by their lock points gives an equivalent serial order, so 2PL
      guarantees conflict serializability. Deadlock is still possible, and since exclusive locks
      can be released before commit, cascading rollbacks are too. Acquiring a lock after releasing
      one is exactly what the two phases forbid.

  - key: dbms-2pl-002
    concept: locking-2pl
    also: [recoverability]
    difficulty: 3
    source: original
    type: MSQ
    stem: |
      Which of these does **strict** two-phase locking guarantee? Select all that apply.
    options:
      - text: Conflict serializability
        correct: true
      - text: Freedom from deadlock
        misconception: two-pl-prevents-deadlock
      - text: Cascadeless schedules
        correct: true
      - text: Recoverable schedules
        correct: true
    explanation: |
      Strict 2PL is 2PL, so schedules are conflict serializable. Holding exclusive locks until
      commit means nobody reads uncommitted data, so schedules are cascadeless and therefore
      recoverable. Transactions can still wait on each other's locks in a cycle, so deadlock is
      possible.

  - key: dbms-bplus-001
    concept: bplus-trees
    difficulty: 3
    source: original
    stem: |
      A B+ tree is stored with one node per 512-byte block. A search key takes 8 bytes and a
      block pointer takes 4 bytes. What is the largest number of child pointers an internal
      node can have?
    options:
      - text: "42"
        misconception: bplus-forget-extra-pointer
      - text: "43"
        correct: true
      - text: "64"
        misconception: bplus-ignore-pointers
      - text: "128"
    explanation: |
      An internal node with $p$ pointers holds $p - 1$ keys:
      $4p + 8(p - 1) \le 512 \Rightarrow 12p \le 520 \Rightarrow p \le 43.3$, so $p = 43$.

  - key: dbms-er-001
    concept: er-to-relational
    also: [er-model]
    difficulty: 2
    source: original
    stem: |
      An ER diagram has two strong entity sets, E1 and E2, joined by a one-to-many relationship
      R with no attributes of its own. None of the attributes is multivalued. What is the
      minimum number of relational tables needed?
    options:
      - text: "1"
      - text: "2"
        correct: true
      - text: "3"
        misconception: relationship-always-table
      - text: "4"
    explanation: |
      Each strong entity set needs its own table. The one-to-many relationship is stored as a
      foreign key in the table on the "many" side, so no third table is needed. A many-to-many
      relationship would need its own table.
